server:
  port: ${SERVER_PORT:8093}
spring:
  application:
    name: iig-catalog-service
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5434/iig_catalog}
    username: ${CATALOG_DB_USERNAME:iig_catalog}
    password: ${CATALOG_DB_PASSWORD}
  sql:
    init:
      mode: always
      continue-on-error: false
iig:
  core:
    url: ${CORE_INTERNAL_URL:http://localhost:8081}
    internal-key: ${CATALOG_INTERNAL_API_KEY}
management:
  endpoints:
    web:
      exposure:
        include: health,info
