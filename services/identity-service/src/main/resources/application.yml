server:
  port: ${SERVER_PORT:8094}
spring:
  application:
    name: iig-authentication-service
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5435/iig_identity}
    username: ${IDENTITY_DB_USERNAME:iig_identity}
    password: ${IDENTITY_DB_PASSWORD}
  sql:
    init:
      mode: always
      continue-on-error: false
iig:
  core:
    url: ${CORE_INTERNAL_URL:http://localhost:8081}
    internal-key: ${IDENTITY_INTERNAL_API_KEY}
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
management:
  endpoints:
    web:
      exposure:
        include: health,info
