server:
  port: ${SERVER_PORT:8100}
spring:
  application:
    name: iig-attendance-service
  datasource:
    url: ${ATTENDANCE_DB_URL:jdbc:postgresql://localhost:5441/iig_attendance}
    username: ${ATTENDANCE_DB_USERNAME:iig_attendance}
    password: ${ATTENDANCE_DB_PASSWORD}
  sql:
    init:
      mode: always
      continue-on-error: false
iig:
  attendance:
    command-recovery-enabled: ${ATTENDANCE_COMMAND_RECOVERY_ENABLED:false}
  core:
    url: ${CORE_INTERNAL_URL:http://localhost:8081}
    internal-key: ${ATTENDANCE_INTERNAL_API_KEY:}
  payroll:
    # A distinct Payroll service key; never reuse Attendance's Core key.
    evidence-key: ${PAYROLL_INTERNAL_API_KEY:}
  attendance:
    source-relay-enabled: ${ATTENDANCE_SOURCE_RELAY_ENABLED:false}
    # Public PUT ingress is opt-in; Core remains the transactional writer.
    write-gateway-enabled: ${ATTENDANCE_WRITE_GATEWAY_ENABLED:false}
    initial-delay-ms: 8000
    poll-ms: 5000
management:
  endpoints:
    web:
      exposure:
        include: health,info
