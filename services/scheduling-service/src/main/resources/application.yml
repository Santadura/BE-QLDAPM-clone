server:
  port: ${SERVER_PORT:8098}
spring:
  application:
    name: iig-scheduling-service
  datasource:
    url: ${SCHEDULING_DB_URL:jdbc:postgresql://localhost:5439/iig_scheduling}
    username: ${SCHEDULING_DB_USERNAME:iig_scheduling}
    password: ${SCHEDULING_DB_PASSWORD}
  sql:
    init:
      mode: always
      continue-on-error: false
iig:
  core:
    url: ${CORE_INTERNAL_URL:http://localhost:8081}
    internal-key: ${SCHEDULING_INTERNAL_API_KEY}
  scheduling:
    # Future Core reference relay: must not run before controlled writer cutover.
    assignment-reference-relay-enabled: ${SCHEDULING_REFERENCE_RELAY_ENABLED:false}
    # Internal-only standalone CS/Sale writer: opt in under controlled cutover.
    assignment-executor-enabled: ${SCHEDULING_ASSIGNMENT_EXECUTOR_ENABLED:false}
    # Admin-only exact receipt reconciliation, never an automatic rollback.
    recovery-enabled: ${SCHEDULING_RECOVERY_ENABLED:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info
