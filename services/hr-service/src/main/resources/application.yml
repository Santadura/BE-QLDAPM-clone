server:
  port: ${SERVER_PORT:8096}
spring:
  application:
    name: iig-hr-service
  datasource:
    url: ${HR_DB_URL:jdbc:postgresql://localhost:5437/iig_hr}
    username: ${HR_DB_USERNAME:iig_hr}
    password: ${HR_DB_PASSWORD}
  sql:
    init:
      mode: always
      continue-on-error: false
iig:
  identity:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8094}
    internal-key: ${IDENTITY_PRINCIPAL_INTERNAL_API_KEY}
  core:
    url: ${CORE_INTERNAL_URL:http://localhost:8081}
    internal-key: ${HR_INTERNAL_API_KEY}
management:
  endpoints:
    web:
      exposure:
        include: health,info
