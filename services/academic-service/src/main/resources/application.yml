server:
  port: ${SERVER_PORT:8099}
spring:
  application:
    name: iig-academic-service
  datasource:
    url: ${ACADEMIC_DB_URL:jdbc:postgresql://localhost:5440/iig_academic}
    username: ${ACADEMIC_DB_USERNAME:iig_academic}
    password: ${ACADEMIC_DB_PASSWORD}
  sql:
    init:
      mode: always
      # PL/pgSQL function bodies contain semicolons. A distinct statement
      # separator prevents Spring ScriptUtils from truncating $ blocks.
      separator: "@@"
      continue-on-error: false
iig:
  academic:
    session-relay-enabled: ${ACADEMIC_SESSION_SOURCE_RELAY_ENABLED:false}
    # Student and membership source import is read-only, opt-in until CI parity proof.
    roster-relay-enabled: ${ACADEMIC_ROSTER_SOURCE_RELAY_ENABLED:false}
    # Admin-only version-checked Academic reads; Teacher retains Core class ACL.
    student-list-read-enabled: ${ACADEMIC_STUDENT_LIST_READ_ENABLED:false}
    # Independent Admin-only StudentDetail fields; both remain OFF by default.
    student-targets-read-enabled: ${ACADEMIC_STUDENT_TARGETS_READ_ENABLED:false}
    student-results-read-enabled: ${ACADEMIC_STUDENT_RESULTS_READ_ENABLED:false}
    event-session-read-enabled: ${ACADEMIC_EVENT_SESSION_READ_ENABLED:false}
    # Private, non-authoritative candidate-only transaction; OFF for all users.
    candidate-handoff-recovery-enabled: ${ACADEMIC_CANDIDATE_HANDOFF_RECOVERY_ENABLED:false}
    candidate-writer-enabled: ${ACADEMIC_CANDIDATE_WRITER_ENABLED:false}
    # Private audited session rehearsal closure; never on by default.
    session-disposition-enabled: ${ACADEMIC_SESSION_DISPOSITION_ENABLED:false}
    # Academic Target/Result candidate journal: private NON-AUTHORITATIVE
    # rehearsal, no downstream dispatcher, and OFF outside disposable CI.
    roster-candidate-enabled: ${ACADEMIC_ROSTER_CANDIDATE_ENABLED:false}
    # Explicitly discard never-authoritative rehearsals, OFF by default.
    roster-disposition-enabled: ${ACADEMIC_ROSTER_DISPOSITION_ENABLED:false}
    # Replays exact committed local evidence before Core claim release.
    roster-handoff-recovery-enabled: ${ACADEMIC_ROSTER_HANDOFF_RECOVERY_ENABLED:false}
  crossdomain:
    attendance-url: ${ATTENDANCE_INTERNAL_URL:http://localhost:8100}
    attendance-key: ${ATTENDANCE_INTERNAL_API_KEY}
    scheduling-url: ${SCHEDULING_INTERNAL_URL:http://localhost:8098}
    scheduling-key: ${SCHEDULING_INTERNAL_API_KEY}
  core:
    url: ${CORE_INTERNAL_URL:http://localhost:8081}
    internal-key: ${ACADEMIC_INTERNAL_API_KEY}
management:
  endpoints:
    web:
      exposure:
        include: health,info
