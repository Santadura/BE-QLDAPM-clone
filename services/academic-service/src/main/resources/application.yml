server:
  port: ${SERVER_PORT:8099}
spring:
  application:
    name: iig-academic-service
  datasource:
    url: ${ACADEMIC_DB_URL:jdbc:postgresql://localhost:5440/iig_academic}
    username: ${ACADEMIC_DB_USERNAME:iig_academic}
    password: ${ACADEMIC_DB_PASSWORD}
  sql:
    init:
      mode: always
      # PL/pgSQL function bodies contain semicolons. A distinct statement
      # separator prevents Spring ScriptUtils from truncating $ blocks.
      separator: "@@"
      continue-on-error: false
iig:
  academic:
    session-relay-enabled: ${ACADEMIC_SESSION_SOURCE_RELAY_ENABLED:false}
    event-session-read-enabled: ${ACADEMIC_EVENT_SESSION_READ_ENABLED:false}
  core:
    url: ${CORE_INTERNAL_URL:http://localhost:8081}
    internal-key: ${ACADEMIC_INTERNAL_API_KEY}
management:
  endpoints:
    web:
      exposure:
        include: health,info
