server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: iig-api-gateway
  cloud:
    gateway:
      # Browser preflight must terminate at the edge. The core security CORS
      # config is retained for the legacy (non-gateway) deployment.
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:5173
              - http://localhost:3000
            allowedMethods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
            allowedHeaders: ["*"]
            allowCredentials: true
            maxAge: 3600
      # Core and Gateway can both add ACAO; return exactly one value.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      httpclient:
        connect-timeout: 3000
        response-timeout: 45s
      routes:
        # Strangler migration: retain every /api/** contract while individual
        # bounded contexts are extracted into separately owned services.
        - id: legacy-core
          uri: ${CORE_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/**
management:
  endpoints:
    web:
      exposure:
        include: health,info
