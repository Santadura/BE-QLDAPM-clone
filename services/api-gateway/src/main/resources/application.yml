server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: iig-api-gateway
  cloud:
    gateway:
      # Core and Gateway can both add ACAO; return exactly one value.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      httpclient:
        connect-timeout: 3000
        response-timeout: 45s
      routes:
        # Phase 8a: schedule GETs served from independent Scheduling read
        # database. POST/PUT/DELETE remain in Core for class/CS invariants.
        - id: scheduling-assignment-teaching-read
          uri: ${SCHEDULING_SERVICE_URI:http://localhost:8098}
          predicates:
            - Path=/api/teaching-schedules
            - Method=GET
        - id: scheduling-assignment-staff-read
          uri: ${SCHEDULING_SERVICE_URI:http://localhost:8098}
          predicates:
            - Path=/api/staff-schedules
            - Method=GET
        - id: scheduling-assignment-worker-read
          uri: ${SCHEDULING_SERVICE_URI:http://localhost:8098}
          predicates:
            - Path=/api/schedules/me
            - Method=GET
        # Availability is now registered/reviewed in Scheduling's independent
        # database. Other class/teacher/staff assignments remain in Core.
        - id: scheduling-availabilities
          uri: ${SCHEDULING_SERVICE_URI:http://localhost:8098}
          predicates:
            - Path=/api/availabilities,/api/availabilities/**
        # Academic's isolated PostgreSQL records the read result on every
        # authorized request. Core still owns lesson mutations and ACLs until
        # event-based Academic ownership is fully verified.
        - id: academic-class-planning-read
          uri: ${ACADEMIC_SERVICE_URI:http://localhost:8099}
          predicates:
            - Path=/api/class-planning
            - Method=GET
        - id: academic-planned-sessions-read
          uri: ${ACADEMIC_SERVICE_URI:http://localhost:8099}
          predicates:
            - Path=/api/classes/*/planned-sessions
            - Method=GET
        # HR owns salary-rank writes; core only retains a versioned FK copy.
        - id: hr-salary-ranks
          uri: ${HR_SERVICE_URI:http://localhost:8096}
          predicates:
            - Path=/api/payroll/ranks,/api/payroll/ranks/**
        # Payroll owns the ledger and calculation; rank reviews/assignments
        # remain with Core and salary rank management is HR-owned.
        - id: payroll-legacy-hr-actions
          uri: ${CORE_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/payroll/rank-assignments/**,/api/payroll/reviews/**,/api/payroll/employees/**,/api/payroll/*/history
        - id: payroll-ledger
          uri: ${PAYROLL_SERVICE_URI:http://localhost:8097}
          predicates:
            - Path=/api/payroll,/api/payroll/calculate,/api/payroll/*/*
        # Only certificate read/write API is migrated to HR at this stage.
        - id: hr-certificates
          uri: ${HR_SERVICE_URI:http://localhost:8096}
          predicates:
            - Path=/api/employee-management/*/certificates,/api/employee-management/*/certificates/**
        # Admin statistics are now served from an independent read-model DB.
        - id: reporting-dashboard
          uri: ${REPORTING_SERVICE_URI:http://localhost:8095}
          predicates:
            - Path=/api/dashboard,/api/dashboard/**
        - id: reporting-statistics
          uri: ${REPORTING_SERVICE_URI:http://localhost:8095}
          predicates:
            - Path=/api/statistics,/api/statistics/**
        # Only login/logout migrate in this stage. Registration and other
        # account/role writes remain in legacy core until Identity owns them.
        - id: identity-login
          uri: ${IDENTITY_SERVICE_URI:http://localhost:8094}
          predicates:
            - Path=/api/auth/login
        - id: identity-logout
          uri: ${IDENTITY_SERVICE_URI:http://localhost:8094}
          predicates:
            - Path=/api/auth/logout
        # Most-specific catalog route must precede the core /api/** fallback.
        # This retains FE contracts while using catalog-owned persistence.
        - id: course-catalog-options
          uri: ${CATALOG_SERVICE_URI:http://localhost:8093}
          predicates:
            - Path=/api/classes/courses
        - id: course-catalog-admin
          uri: ${CATALOG_SERVICE_URI:http://localhost:8093}
          predicates:
            - Path=/api/catalog/**
        # Strangler migration: retain every /api/** contract while individual
        # bounded contexts are extracted into separately owned services.
        - id: legacy-core
          uri: ${CORE_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/**
# Keep the allowed browser origins explicit; override from environment in deployment.
iig:
  cors:
    allowed-origins: ${GATEWAY_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
