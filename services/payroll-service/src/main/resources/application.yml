server:
  port: ${SERVER_PORT:8097}
spring:
  application:
    name: iig-payroll-service
  datasource:
    url: ${PAYROLL_DB_URL:jdbc:postgresql://localhost:5438/iig_payroll}
    username: ${PAYROLL_DB_USERNAME:iig_payroll}
    password: ${PAYROLL_DB_PASSWORD}
  sql:
    init:
      mode: always
      continue-on-error: false
iig:
  attendance:
    url: ${ATTENDANCE_SERVICE_URL:http://localhost:8100}
  core:
    url: ${CORE_INTERNAL_URL:http://localhost:8081}
    internal-key: ${PAYROLL_INTERNAL_API_KEY}
management:
  endpoints:
    web:
      exposure:
        include: health,info
