name: IIG Microservices migration regression

on:
  pull_request:
    paths:
      - 'services/**'
      - 'docker-compose.microservices.yml'
      - 'src/main/java/com/example/demo/service/AuditOutboxRelay.java'
      - 'src/main/java/com/example/demo/controller/SchedulingAssignmentReadBridge.java'
      - 'src/main/java/com/example/demo/controller/SchedulingAcademicFactsBridge.java'
      - 'src/main/java/com/example/demo/controller/SchedulingAcademicLeaseBridge.java'
      - 'src/main/java/com/example/demo/controller/SchedulingAssignmentReferenceBridge.java'
      - 'src/main/java/com/example/demo/controller/SchedulingAssignmentReferenceReceiptController.java'
      - 'src/test/java/com/example/demo/controller/SchedulingAssignmentReferenceReceiptControllerTest.java'
      - 'src/test/java/com/example/demo/controller/SchedulingAssignmentReferenceBridgeTest.java'
      - 'src/test/java/com/example/demo/controller/SchedulingAcademicLeaseBridgeTest.java'
      - 'src/test/java/com/example/demo/controller/SchedulingAcademicFactsBridgeTest.java'
      - 'scripts/check-scheduling-cutover.sh'
      - 'src/main/java/com/example/demo/controller/SchedulingController.java'
      - 'src/main/java/com/example/demo/controller/ClassStaffingRangeController.java'
      - 'src/main/java/com/example/demo/service/Scheduling*.java'
      - 'src/test/java/com/example/demo/controller/SchedulingAssignmentReadBridgeTest.java'
      - 'src/test/java/com/example/demo/service/Scheduling*.java'
      - 'src/main/resources/application.yml'
      - 'prisma/**'
      - 'scripts/smoke-microservices.sh'
      - '.github/workflows/iig-microservices.yml'
  push:
    branches:
      - feature/spring-microservices-migration-20261109
      - feature/spring-microservices-identity-20261109
      - feature/spring-microservices-reporting-20261109
      - feature/spring-microservices-dashboard-20261109
      - feature/spring-microservices-hr-certificates-20261109
  workflow_dispatch:

concurrency:
  group: microservices-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  service-tests:
    name: Gateway, Scheduling, Payroll, HR, Reporting, Identity, Catalog, Audit, core and Prisma validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Core tests
        run: mvn -B -ntp test
      - name: API Gateway tests
        run: mvn -B -ntp -f services/api-gateway/pom.xml test
      - name: Audit microservice tests
        run: mvn -B -ntp -f services/audit-service/pom.xml test
      - name: Catalog microservice tests
        run: mvn -B -ntp -f services/catalog-service/pom.xml test
      - name: Identity authentication microservice tests
        run: mvn -B -ntp -f services/identity-service/pom.xml test
      - name: Reporting microservice tests
        run: mvn -B -ntp -f services/reporting-service/pom.xml test
      - name: HR certificate microservice tests
        run: mvn -B -ntp -f services/hr-service/pom.xml test
      - name: Payroll microservice tests
        run: mvn -B -ntp -f services/payroll-service/pom.xml test
      - name: Scheduling availability microservice tests
        run: mvn -B -ntp -f services/scheduling-service/pom.xml test
      - name: Validate Prisma schema
        run: |
          npm ci
          npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qlapm_db?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/qlapm_db?schema=public
      - name: Validate compose topology
        run: docker compose -f docker-compose.microservices.yml config --quiet

  distributed-smoke:
    name: Docker PostgreSQL x8, Gateway, Scheduling, Payroll, HR, Reporting, Identity, Catalog, Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build and start isolated microservices
        run: docker compose -f docker-compose.microservices.yml up --build -d
      - name: Gateway / business / audit outage regression
        run: bash scripts/smoke-microservices.sh
      - name: Checkout current FE to verify browser compatibility through Gateway
        uses: actions/checkout@v4
        with:
          repository: Santadura/FE-QLDAPM-clone
          ref: feature/compact-week-scheduling-from-main-20261028
          path: frontend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install React and Playwright browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npm install --prefix e2e --no-audit --no-fund
          ./e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Start Vite frontend
        shell: bash
        run: |
          cd frontend
          nohup npm run dev -- --host 127.0.0.1 >/tmp/iig-micro-vite.log 2>&1 &
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              echo "Vite ready"; exit 0
            fi
            sleep 2
          done
          cat /tmp/iig-micro-vite.log
          exit 1
      - name: Run real browser regression through Spring Cloud Gateway
        working-directory: frontend
        env:
          CI: 'true'
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:8080/api
          E2E_SEED_PASSWORD: '123456'
        run: ./e2e/node_modules/.bin/playwright test --config=e2e/playwright.config.mjs
      - name: Print service logs when smoke fails
        if: failure()
        run: docker compose -f docker-compose.microservices.yml logs --no-color --tail=160 db-init postgres backend api-gateway audit-service catalog-service identity-service reporting-service hr-service payroll-service scheduling-service
      - name: Logs for diagnosis
        if: always()
        run: |
          mkdir -p artifacts/microservices
          docker compose -f docker-compose.microservices.yml logs --no-color > artifacts/microservices/stack.log 2>&1 || true
          docker compose -f docker-compose.microservices.yml ps -a > artifacts/microservices/containers.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iig-microservices-logs
          path: |
            artifacts/microservices
            frontend/e2e/artifacts
          retention-days: 7
      - name: Destroy disposable databases and containers
        if: always()
        run: docker compose -f docker-compose.microservices.yml down -v --remove-orphans
