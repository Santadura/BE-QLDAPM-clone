name: IIG Class & Student integrity regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/class-student-integrity-20261027]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Compile and run regression/unit tests
        run: mvn -B -ntp test
      - name: Validate Prisma schema
        run: |
          npm ci
          npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qlapm_db?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/qlapm_db?schema=public
