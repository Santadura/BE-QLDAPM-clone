name: IIG Class & Student integrity regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/class-student-integrity-20261027]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Compile and run regression/unit tests
        run: mvn -B -ntp test
      - name: Validate Prisma schema
        run: |
          npm ci
          npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qlapm_db?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/qlapm_db?schema=public

  postgres-integration:
    name: Real PostgreSQL class/business regression
    needs: backend-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start disposable database, migrations, seed and Spring Boot
        run: docker compose up --build -d
      - name: Wait for seeded API to accept authentication
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..100}; do
            if curl --silent --show-error --max-time 4 -X POST http://localhost:8080/api/auth/login \
                -H 'Content-Type: application/json' \
                -d '{"username":"admin","password":"123456"}' | grep -q '"token"'; then
              echo "BE API and seeded database are ready"
              exit 0
            fi
            sleep 3
          done
          docker compose ps -a
          exit 1
      - name: Test student clashes, lifecycle transitions and teacher substitutions
        run: node scripts/test-class-integrity.mjs
        env:
          IIG_TEST_API: http://localhost:8080/api
          IIG_TEST_PASSWORD: '123456'
      - name: Save backend logs if the integration test fails
        if: failure()
        run: |
          mkdir -p integrity-artifacts
          docker compose ps -a > integrity-artifacts/docker-status.txt 2>&1 || true
          docker compose logs --no-color > integrity-artifacts/docker.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: class-integrity-db-logs
          path: integrity-artifacts/
          retention-days: 7
          if-no-files-found: warn
      - name: Remove temporary CI database and containers
        if: always()
        run: docker compose down -v --remove-orphans
