name: IIG BE tests + full-stack Playwright

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: be-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Maven test + Prisma validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: mvn -B -ntp test
      - run: npm ci
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/qlapm_db?schema=public
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/qlapm_db?schema=public

  full-stack-e2e:
    name: Real DB, BE + FE browser regression
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Checkout matching FE branch (fallback main)
        uses: actions/checkout@v4
        with:
          repository: Santadura/FE-QLDAPM-clone
          path: frontend
          ref: main
      - name: Use matching FE PR branch when available
        shell: bash
        env:
          SIBLING_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if git -C frontend ls-remote --exit-code --heads origin "$SIBLING_REF" >/dev/null 2>&1; then
            git -C frontend fetch --depth=1 origin "$SIBLING_REF"
            git -C frontend checkout --detach FETCH_HEAD
            echo "Testing frontend branch $SIBLING_REF"
          else
            echo "Testing frontend main (no matching branch)"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Start disposable PostgreSQL, migration, seed and API
        run: docker compose up -d --build
      - name: Wait for real backend readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..100}; do
            status=$(curl --silent -o /dev/null -w "%{http_code}" http://localhost:8080/api/public/ping || true)
            if [[ "$status" == "200" || "$status" == "401" ]]; then
              echo "Backend ready"
              exit 0
            fi
            sleep 3
          done
          docker compose ps -a
          exit 1
      - name: Install FE + Playwright and browser
        working-directory: frontend
        run: |
          npm ci
          npm install --prefix e2e --no-audit --no-fund
          ./e2e/node_modules/.bin/playwright install --with-deps chromium
      - name: Start Vite on port 5173
        shell: bash
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 > /tmp/iig-vite.log 2>&1 &
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              echo "Vite ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/iig-vite.log
          exit 1
      - name: Run browser + API end-to-end suite
        working-directory: frontend
        env:
          CI: 'true'
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:8080/api
          E2E_SEED_PASSWORD: '123456'
        run: ./e2e/node_modules/.bin/playwright test --config=e2e/playwright.config.mjs
      - name: Save service logs
        if: always()
        shell: bash
        run: |
          mkdir -p frontend/e2e/artifacts
          docker compose ps -a > frontend/e2e/artifacts/docker-status.txt 2>&1 || true
          docker compose logs --no-color > frontend/e2e/artifacts/docker.log 2>&1 || true
          cp /tmp/iig-vite.log frontend/e2e/artifacts/vite.log 2>/dev/null || true
      - name: Upload trace, screenshots, logs and HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iig-be-playwright-results
          path: frontend/e2e/artifacts/
          retention-days: 7
          if-no-files-found: warn
      - name: Stop disposable containers
        if: always()
        run: docker compose down -v --remove-orphans
