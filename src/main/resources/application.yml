server:
  port: 8080
  servlet:
    session:
      timeout: 10m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: gk-academy-backend

  config:
    # Allows local development to use a root .env file copied from .env.example.
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/qlapm_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Prisma migrations own the database schema.
      # Hibernate only validates that mapped entities match the migrated schema.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-256-bits-please}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    org.springframework.security: INFO

chat:
  ai-enabled: ${CHAT_AI_ENABLED:false}
  provider: ${CHAT_AI_PROVIDER:openai}
  api-key: ${OPENAI_API_KEY:}
  gemini-api-key: ${GEMINI_API_KEY:}
  model: ${CHAT_AI_MODEL:}


social:
  frontend-url: ${SOCIAL_FRONTEND_URL:http://localhost:5173}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  google-client-secret: ${GOOGLE_CLIENT_SECRET:}
  facebook-client-id: ${FACEBOOK_CLIENT_ID:}
  facebook-client-secret: ${FACEBOOK_CLIENT_SECRET:}
  facebook-api-version: ${FACEBOOK_API_VERSION:v26.0}

payment:
  sandbox: ${PAYMENT_SANDBOX:true}
  frontend-url: ${PAYMENT_FRONTEND_URL:http://localhost:5173}
  public-api-url: ${PAYMENT_PUBLIC_API_URL:}
  vnpay-tmn-code: ${VNPAY_TMN_CODE:}
  vnpay-hash-secret: ${VNPAY_HASH_SECRET:}
  momo-partner-code: ${MOMO_PARTNER_CODE:}
  momo-access-key: ${MOMO_ACCESS_KEY:}
  momo-secret-key: ${MOMO_SECRET_KEY:}
  momo-endpoint: ${MOMO_ENDPOINT:}
  momo-redirect-url: ${MOMO_REDIRECT_URL:}
  momo-ipn-url: ${MOMO_IPN_URL:}
