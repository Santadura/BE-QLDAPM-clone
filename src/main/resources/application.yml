server:
  port: 8080

spring:
  application:
    name: qldapm-backend

  config:
    # Allows local development to use a root .env file copied from .env.example.
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/qlapm_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Prisma migrations own the database schema.
      # Hibernate only validates that mapped entities match the migrated schema.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-key-at-least-256-bits-please}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    org.springframework.security: INFO

# Disabled in the legacy monolith deployment. Enabled by the microservices stack.
iig:
  attendance:
    bridge-enabled: ${ATTENDANCE_BRIDGE_ENABLED:false}
    native-reference-enabled: ${ATTENDANCE_NATIVE_REFERENCE_ENABLED:false}
    internal-key: ${ATTENDANCE_INTERNAL_API_KEY:}
    # Only microservices Compose disables the legacy direct Core PUT endpoint.
    public-write-enabled: ${ATTENDANCE_PUBLIC_WRITE_ENABLED:true}
  academic:
    bridge-enabled: ${ACADEMIC_BRIDGE_ENABLED:false}
    internal-key: ${ACADEMIC_INTERNAL_API_KEY:}
    public-write-enabled: ${ACADEMIC_PUBLIC_WRITE_ENABLED:true}
    native-command-claims-enabled: ${ACADEMIC_NATIVE_COMMAND_CLAIMS_ENABLED:false}
    candidate-claims-enabled: ${ACADEMIC_CANDIDATE_CLAIMS_ENABLED:false}
    # Private Core roster claims; production/default OFF until rehearsal.
    roster-claims-enabled: ${ACADEMIC_ROSTER_CLAIMS_ENABLED:false}
  scheduling:
    bridge-enabled: ${SCHEDULING_BRIDGE_ENABLED:false}
    assignment-relay-enabled: ${SCHEDULING_ASSIGNMENT_RELAY_ENABLED:false}
    # Strictly opt-in after approved cutover; internal Core reference receiver only.
    reference-writes-enabled: ${SCHEDULING_REFERENCE_WRITES_ENABLED:false}
    # Private TEACHING mirror; do not enable before a verified Scheduling
    # teacher command writer and finalized Attendance/Payroll reconciliation.
    teacher-reference-writes-enabled: ${SCHEDULING_TEACHER_REFERENCE_WRITES_ENABLED:false}
    # Irreversible orphan TC-claim revocation requires live ADMIN and
    # a terminal Scheduling audit proof. OFF in normal deployments.
    teacher-claim-recovery-enabled: ${SCHEDULING_TEACHER_CLAIM_RECOVERY_ENABLED:false}
    external-availability: ${SCHEDULING_AVAILABILITY_EXTERNAL:false}
    url: ${SCHEDULING_SERVICE_URL:http://localhost:8098}
    internal-key: ${SCHEDULING_INTERNAL_API_KEY:}
  payroll:
    bridge-enabled: ${PAYROLL_BRIDGE_ENABLED:false}
    internal-key: ${PAYROLL_INTERNAL_API_KEY:}
  hr:
    certificate-bridge-enabled: ${HR_CERTIFICATE_BRIDGE_ENABLED:false}
    external-certificates: ${HR_CERTIFICATES_EXTERNAL:false}
    internal-key: ${HR_INTERNAL_API_KEY:}
  reporting:
    bridge-enabled: ${REPORTING_BRIDGE_ENABLED:false}
    internal-key: ${REPORTING_INTERNAL_API_KEY:}
  identity:
    bridge-enabled: ${IDENTITY_BRIDGE_ENABLED:false}
    internal-key: ${IDENTITY_INTERNAL_API_KEY:}
  catalog:
    enabled: ${CATALOG_PROJECTION_ENABLED:false}
    internal-key: ${CATALOG_INTERNAL_API_KEY:}
  audit:
    relay-enabled: ${AUDIT_RELAY_ENABLED:false}
    base-url: ${AUDIT_SERVICE_URL:}
    internal-key: ${AUDIT_INTERNAL_API_KEY:}
    initial-delay-ms: 8000
    poll-ms: 5000
