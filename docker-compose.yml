# Local development: one command starts PostgreSQL, runs Prisma migrations,
# seeds only a fresh database, and launches the Spring Boot API.
services:
  postgres:
    image: postgres:16-alpine
    container_name: qldapm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qlapm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qlapm_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - qlapm_pgdata:/var/lib/postgresql/data

  db-init:
    build:
      context: .
      dockerfile: Dockerfile.prisma
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/qlapm_db?schema=public
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/qlapm_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/qlapm_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret-key-at-least-256-bits-please}
      SOCIAL_FRONTEND_URL: ${SOCIAL_FRONTEND_URL:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      FACEBOOK_API_VERSION: ${FACEBOOK_API_VERSION:-v26.0}
      PAYMENT_SANDBOX: ${PAYMENT_SANDBOX:-true}
      PAYMENT_FRONTEND_URL: ${PAYMENT_FRONTEND_URL:-http://localhost:5173}
      PAYMENT_PUBLIC_API_URL: ${PAYMENT_PUBLIC_API_URL:-}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
      MOMO_ENDPOINT: ${MOMO_ENDPOINT:-}
      MOMO_REDIRECT_URL: ${MOMO_REDIRECT_URL:-}
      MOMO_IPN_URL: ${MOMO_IPN_URL:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CHAT_AI_ENABLED: ${CHAT_AI_ENABLED:-false}
      CHAT_AI_PROVIDER: ${CHAT_AI_PROVIDER:-openai}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHAT_AI_MODEL: ${CHAT_AI_MODEL:-}
    ports:
      - "8080:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  qlapm_pgdata:
