# Parallel, opt-in architecture: the legacy compose file remains untouched.
# Start: docker compose -f docker-compose.microservices.yml up --build -d
# Gateway is the ONLY externally published HTTP entrypoint (localhost:8080).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qlapm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:-postgres}
    volumes:
      - core_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qlapm_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-init:
    build:
      context: .
      dockerfile: Dockerfile.prisma
    environment:
      DATABASE_URL: postgresql://postgres:${CORE_DB_PASSWORD:-postgres}@postgres:5432/qlapm_db?schema=public
      DIRECT_URL: postgresql://postgres:${CORE_DB_PASSWORD:-postgres}@postgres:5432/qlapm_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/qlapm_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${CORE_DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret-key-at-least-256-bits-please}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ATTENDANCE_BRIDGE_ENABLED: "true"
      ATTENDANCE_PUBLIC_WRITE_ENABLED: "false"
      ATTENDANCE_INTERNAL_API_KEY: ${ATTENDANCE_INTERNAL_API_KEY:-local-dev-attendance-key-change-before-deployment}
      ACADEMIC_BRIDGE_ENABLED: "true"
      ACADEMIC_PUBLIC_WRITE_ENABLED: "false"
      ACADEMIC_CANDIDATE_CLAIMS_ENABLED: "true"
      ACADEMIC_INTERNAL_API_KEY: ${ACADEMIC_INTERNAL_API_KEY:-local-dev-academic-key-change-before-deployment}
      SCHEDULING_BRIDGE_ENABLED: "true"
      SCHEDULING_ASSIGNMENT_RELAY_ENABLED: "true"
      SCHEDULING_REFERENCE_WRITES_ENABLED: ${SCHEDULING_REFERENCE_WRITES_ENABLED:-false}
      # Phase 8g TEACHING reference receiver: private, independent switch.
      # Never enable in a normal Core-authoritative deployment.
      SCHEDULING_TEACHER_REFERENCE_WRITES_ENABLED: ${SCHEDULING_TEACHER_REFERENCE_WRITES_ENABLED:-false}
      SCHEDULING_TEACHER_CLAIM_RECOVERY_ENABLED: ${SCHEDULING_TEACHER_CLAIM_RECOVERY_ENABLED:-false}
      SCHEDULING_AVAILABILITY_EXTERNAL: "true"
      SCHEDULING_INTERNAL_API_KEY: ${SCHEDULING_INTERNAL_API_KEY:-local-dev-scheduling-key-change-before-deployment}
      SCHEDULING_SERVICE_URL: http://scheduling-service:8098
      PAYROLL_BRIDGE_ENABLED: "true"
      PAYROLL_INTERNAL_API_KEY: ${PAYROLL_INTERNAL_API_KEY:-local-dev-payroll-key-change-before-deployment}
      HR_CERTIFICATE_BRIDGE_ENABLED: "true"
      HR_CERTIFICATES_EXTERNAL: "true"
      HR_INTERNAL_API_KEY: ${HR_INTERNAL_API_KEY:-local-dev-hr-key-change-before-deployment}
      REPORTING_BRIDGE_ENABLED: "true"
      REPORTING_INTERNAL_API_KEY: ${REPORTING_INTERNAL_API_KEY:-local-dev-reporting-key-change-before-deployment}
      IDENTITY_BRIDGE_ENABLED: "true"
      IDENTITY_INTERNAL_API_KEY: ${IDENTITY_INTERNAL_API_KEY:-local-dev-identity-key-change-before-deployment}
      CATALOG_PROJECTION_ENABLED: "true"
      CATALOG_INTERNAL_API_KEY: ${CATALOG_INTERNAL_API_KEY:-local-dev-catalog-key-change-before-deployment}
      AUDIT_RELAY_ENABLED: "true"
      AUDIT_SERVICE_URL: http://audit-service:8092
      AUDIT_INTERNAL_API_KEY: ${AUDIT_INTERNAL_API_KEY:-local-dev-audit-key-change-before-deployment}
    expose:
      - "8081"
    depends_on:
      db-init:
        condition: service_completed_successfully
      audit-service:
        condition: service_started
    restart: unless-stopped

  audit-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iig_audit
      POSTGRES_USER: iig_audit
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:-local-dev-audit-password}
    volumes:
      - audit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iig_audit -d iig_audit"]
      interval: 5s
      timeout: 5s
      retries: 20

  audit-service:
    build:
      context: ./services/audit-service
    environment:
      SERVER_PORT: "8092"
      AUDIT_DB_URL: jdbc:postgresql://audit-postgres:5432/iig_audit
      AUDIT_DB_USERNAME: iig_audit
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:-local-dev-audit-password}
      AUDIT_INTERNAL_API_KEY: ${AUDIT_INTERNAL_API_KEY:-local-dev-audit-key-change-before-deployment}
    expose:
      - "8092"
    depends_on:
      audit-postgres:
        condition: service_healthy
    restart: unless-stopped

  catalog-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iig_catalog
      POSTGRES_USER: iig_catalog
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-local-dev-catalog-password}
    volumes:
      - catalog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iig_catalog -d iig_catalog"]
      interval: 5s
      timeout: 5s
      retries: 20

  catalog-service:
    build:
      context: ./services/catalog-service
    environment:
      SERVER_PORT: "8093"
      CATALOG_DB_URL: jdbc:postgresql://catalog-postgres:5432/iig_catalog
      CATALOG_DB_USERNAME: iig_catalog
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-local-dev-catalog-password}
      CATALOG_INTERNAL_API_KEY: ${CATALOG_INTERNAL_API_KEY:-local-dev-catalog-key-change-before-deployment}
      CORE_INTERNAL_URL: http://backend:8081
    expose:
      - "8093"
    depends_on:
      catalog-postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  identity-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iig_identity
      POSTGRES_USER: iig_identity
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:-local-dev-identity-password}
    volumes:
      - identity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iig_identity -d iig_identity"]
      interval: 5s
      timeout: 5s
      retries: 20

  identity-service:
    build:
      context: ./services/identity-service
    environment:
      SERVER_PORT: "8094"
      IDENTITY_DB_URL: jdbc:postgresql://identity-postgres:5432/iig_identity
      IDENTITY_DB_USERNAME: iig_identity
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-local-dev-identity-password}
      IDENTITY_INTERNAL_API_KEY: ${IDENTITY_INTERNAL_API_KEY:-local-dev-identity-key-change-before-deployment}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret-key-at-least-256-bits-please}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORE_INTERNAL_URL: http://backend:8081
    expose:
      - "8094"
    depends_on:
      identity-postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  reporting-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iig_reporting
      POSTGRES_USER: iig_reporting
      POSTGRES_PASSWORD: ${REPORTING_DB_PASSWORD:-local-dev-reporting-password}
    volumes:
      - reporting_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iig_reporting -d iig_reporting"]
      interval: 5s
      timeout: 5s
      retries: 20

  reporting-service:
    build:
      context: ./services/reporting-service
    environment:
      SERVER_PORT: "8095"
      REPORTING_DB_URL: jdbc:postgresql://reporting-postgres:5432/iig_reporting
      REPORTING_DB_USERNAME: iig_reporting
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD:-local-dev-reporting-password}
      REPORTING_INTERNAL_API_KEY: ${REPORTING_INTERNAL_API_KEY:-local-dev-reporting-key-change-before-deployment}
      PAYROLL_INTERNAL_API_KEY: ${PAYROLL_INTERNAL_API_KEY:-local-dev-payroll-key-change-before-deployment}
      PAYROLL_SERVICE_URL: http://payroll-service:8097
      REPORTING_MAX_AGE_SECONDS: ${REPORTING_MAX_AGE_SECONDS:-30}
      DASHBOARD_MAX_AGE_SECONDS: ${DASHBOARD_MAX_AGE_SECONDS:-10}
      CORE_INTERNAL_URL: http://backend:8081
    expose:
      - "8095"
    depends_on:
      reporting-postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  hr-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iig_hr
      POSTGRES_USER: iig_hr
      POSTGRES_PASSWORD: ${HR_DB_PASSWORD:-local-dev-hr-password}
    volumes:
      - hr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iig_hr -d iig_hr"]
      interval: 5s
      timeout: 5s
      retries: 20

  hr-service:
    build:
      context: ./services/hr-service
    environment:
      SERVER_PORT: "8096"
      HR_DB_URL: jdbc:postgresql://hr-postgres:5432/iig_hr
      HR_DB_USERNAME: iig_hr
      HR_DB_PASSWORD: ${HR_DB_PASSWORD:-local-dev-hr-password}
      HR_INTERNAL_API_KEY: ${HR_INTERNAL_API_KEY:-local-dev-hr-key-change-before-deployment}
      CORE_INTERNAL_URL: http://backend:8081
    expose:
      - "8096"
    depends_on:
      hr-postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  payroll-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iig_payroll
      POSTGRES_USER: iig_payroll
      POSTGRES_PASSWORD: ${PAYROLL_DB_PASSWORD:-local-dev-payroll-password}
    volumes:
      - payroll_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iig_payroll -d iig_payroll"]
      interval: 5s
      timeout: 5s
      retries: 20

  payroll-service:
    build:
      context: ./services/payroll-service
    environment:
      SERVER_PORT: "8097"
      PAYROLL_DB_URL: jdbc:postgresql://payroll-postgres:5432/iig_payroll
      PAYROLL_DB_USERNAME: iig_payroll
      PAYROLL_DB_PASSWORD: ${PAYROLL_DB_PASSWORD:-local-dev-payroll-password}
      PAYROLL_INTERNAL_API_KEY: ${PAYROLL_INTERNAL_API_KEY:-local-dev-payroll-key-change-before-deployment}
      ATTENDANCE_SERVICE_URL: http://attendance-service:8100
      PAYROLL_ATTENDANCE_REFERENCE_RELAY_ENABLED: "true"
      CORE_INTERNAL_URL: http://backend:8081
    expose:
      - "8097"
    depends_on:
      payroll-postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  scheduling-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iig_scheduling
      POSTGRES_USER: iig_scheduling
      POSTGRES_PASSWORD: ${SCHEDULING_DB_PASSWORD:-local-dev-scheduling-password}
    volumes:
      - scheduling_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iig_scheduling -d iig_scheduling"]
      interval: 5s
      timeout: 5s
      retries: 20

  scheduling-service:
    build:
      context: ./services/scheduling-service
    environment:
      SERVER_PORT: "8098"
      SCHEDULING_DB_URL: jdbc:postgresql://scheduling-postgres:5432/iig_scheduling
      SCHEDULING_DB_USERNAME: iig_scheduling
      SCHEDULING_DB_PASSWORD: ${SCHEDULING_DB_PASSWORD:-local-dev-scheduling-password}
      SCHEDULING_INTERNAL_API_KEY: ${SCHEDULING_INTERNAL_API_KEY:-local-dev-scheduling-key-change-before-deployment}
      CORE_INTERNAL_URL: http://backend:8081
      SCHEDULING_REFERENCE_RELAY_ENABLED: ${SCHEDULING_REFERENCE_RELAY_ENABLED:-false}
      SCHEDULING_ASSIGNMENT_EXECUTOR_ENABLED: ${SCHEDULING_ASSIGNMENT_EXECUTOR_ENABLED:-false}
      # All Phase 8g TEACHING migration endpoints remain PRIVATE and OFF by
      # default; the actual Gateway/public writer remains Core-owned.
      SCHEDULING_ACADEMIC_LEASE_COORDINATOR_ENABLED: ${SCHEDULING_ACADEMIC_LEASE_COORDINATOR_ENABLED:-false}
      SCHEDULING_TEACHER_PREFLIGHT_ENABLED: ${SCHEDULING_TEACHER_PREFLIGHT_ENABLED:-false}
      SCHEDULING_TEACHER_EXECUTOR_ENABLED: ${SCHEDULING_TEACHER_EXECUTOR_ENABLED:-false}
      SCHEDULING_RECOVERY_ENABLED: ${SCHEDULING_RECOVERY_ENABLED:-false}
    expose:
      - "8098"
    depends_on:
      scheduling-postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  academic-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iig_academic
      POSTGRES_USER: iig_academic
      POSTGRES_PASSWORD: ${ACADEMIC_DB_PASSWORD:-local-dev-academic-password}
    volumes:
      - academic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iig_academic -d iig_academic"]
      interval: 5s
      timeout: 5s
      retries: 20

  academic-service:
    build:
      context: ./services/academic-service
    environment:
      SERVER_PORT: "8099"
      ACADEMIC_DB_URL: jdbc:postgresql://academic-postgres:5432/iig_academic
      ACADEMIC_DB_USERNAME: iig_academic
      ACADEMIC_DB_PASSWORD: ${ACADEMIC_DB_PASSWORD:-local-dev-academic-password}
      ACADEMIC_INTERNAL_API_KEY: ${ACADEMIC_INTERNAL_API_KEY:-local-dev-academic-key-change-before-deployment}
      ACADEMIC_SESSION_SOURCE_RELAY_ENABLED: ${ACADEMIC_SESSION_SOURCE_RELAY_ENABLED:-true}
      ACADEMIC_EVENT_SESSION_READ_ENABLED: ${ACADEMIC_EVENT_SESSION_READ_ENABLED:-true}
      ACADEMIC_CANDIDATE_WRITER_ENABLED: ${ACADEMIC_CANDIDATE_WRITER_ENABLED:-false}
      ACADEMIC_CANDIDATE_HANDOFF_RECOVERY_ENABLED: ${ACADEMIC_CANDIDATE_HANDOFF_RECOVERY_ENABLED:-true}
      CORE_INTERNAL_URL: http://backend:8081
    expose:
      - "8099"
    depends_on:
      academic-postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  attendance-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iig_attendance
      POSTGRES_USER: iig_attendance
      POSTGRES_PASSWORD: ${ATTENDANCE_DB_PASSWORD:-local-dev-attendance-password}
    volumes:
      - attendance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iig_attendance -d iig_attendance"]
      interval: 5s
      timeout: 5s
      retries: 20

  attendance-service:
    build:
      context: ./services/attendance-service
    environment:
      SERVER_PORT: "8100"
      ATTENDANCE_DB_URL: jdbc:postgresql://attendance-postgres:5432/iig_attendance
      ATTENDANCE_DB_USERNAME: iig_attendance
      ATTENDANCE_DB_PASSWORD: ${ATTENDANCE_DB_PASSWORD:-local-dev-attendance-password}
      ATTENDANCE_INTERNAL_API_KEY: ${ATTENDANCE_INTERNAL_API_KEY:-local-dev-attendance-key-change-before-deployment}
      PAYROLL_INTERNAL_API_KEY: ${PAYROLL_INTERNAL_API_KEY:-local-dev-payroll-key-change-before-deployment}
      ATTENDANCE_SOURCE_RELAY_ENABLED: ${ATTENDANCE_SOURCE_RELAY_ENABLED:-true}
      ATTENDANCE_WRITE_GATEWAY_ENABLED: "true"
      CORE_INTERNAL_URL: http://backend:8081
    expose:
      - "8100"
    depends_on:
      attendance-postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  api-gateway:
    build:
      context: ./services/api-gateway
    environment:
      SERVER_PORT: "8080"
      CORE_SERVICE_URI: http://backend:8081
      CATALOG_SERVICE_URI: http://catalog-service:8093
      IDENTITY_SERVICE_URI: http://identity-service:8094
      REPORTING_SERVICE_URI: http://reporting-service:8095
      HR_SERVICE_URI: http://hr-service:8096
      PAYROLL_SERVICE_URI: http://payroll-service:8097
      SCHEDULING_SERVICE_URI: http://scheduling-service:8098
      ACADEMIC_SERVICE_URI: http://academic-service:8099
      ATTENDANCE_SERVICE_URI: http://attendance-service:8100
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_started
      catalog-service:
        condition: service_started
      identity-service:
        condition: service_started
      reporting-service:
        condition: service_started
      hr-service:
        condition: service_started
      payroll-service:
        condition: service_started
      scheduling-service:
        condition: service_started
      academic-service:
        condition: service_started
      attendance-service:
        condition: service_started
    restart: unless-stopped

volumes:
  core_pgdata:
  audit_pgdata:
  catalog_pgdata:
  identity_pgdata:
  reporting_pgdata:
  hr_pgdata:
  payroll_pgdata:
  scheduling_pgdata:
  academic_pgdata:
  attendance_pgdata:
